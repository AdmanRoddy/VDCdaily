<style>
/* Layout: white logo bar, navy tab rail, then one working column of sheet cards that mirror the paper reports; a sticky action bar carries hours + submit. */
:root{
  --navy:#0b2339; --red:#bd1d23;
  --bg:#eef1f4; --card:#ffffff; --fg:#14202d; --muted:#5b6876; --line:#d3dae2; --tint:#e8edf2;
  --bar:#ffffff; --rail:#0b2339; --input:#ffffff; --focus:#2d6cdf; --shade:rgba(11,35,57,.45);
  --ok:#1f7a45; --okbg:#e3f3ea; --warn:#8a5200; --warnbg:#fbefd9; --bad:#b0242a; --badbg:#fbe4e5;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c141d; --card:#131e2a; --fg:#e4e9ef; --muted:#93a1b0; --line:#273647; --tint:#1a2837;
  --bar:#101a25; --rail:#081a2b; --input:#0f1923; --focus:#6b9cf0; --shade:rgba(0,0,0,.6);
  --ok:#6fd39a; --okbg:#143224; --warn:#f0b65c; --warnbg:#3a2a10; --bad:#ff8a8f; --badbg:#3c1719; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c141d; --card:#131e2a; --fg:#e4e9ef; --muted:#93a1b0; --line:#273647; --tint:#1a2837;
  --bar:#101a25; --rail:#081a2b; --input:#0f1923; --focus:#6b9cf0; --shade:rgba(0,0,0,.6);
  --ok:#6fd39a; --okbg:#143224; --warn:#f0b65c; --warnbg:#3a2a10; --bad:#ff8a8f; --badbg:#3c1719; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{background:var(--bar);border-bottom:1px solid var(--line)}
.topbar .wrap{padding-block:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#fff;border-radius:4px;padding:4px 6px;display:block;line-height:0}
.logo img{height:52px;width:auto}
.apptitle{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.01em;margin:0;color:var(--fg)}
.who{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
.rail{background:var(--rail)}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;background:transparent;color:#c5d0dc;border:0;padding:11px 14px 10px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--red)}
nav.tabs button:hover{color:#fff}
main .wrap{padding-block:18px 110px;display:flex;flex-direction:column;gap:14px}
.banner{border-radius:6px;padding:10px 12px;font-size:14px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:6px;min-width:0}
.sheet>.hd{padding:14px 16px 10px;border-bottom:2px solid var(--navy);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
:root[data-theme="dark"] .sheet>.hd{border-bottom-color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sheet>.hd{border-bottom-color:var(--red)}}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:25px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.sec{padding:14px 16px 16px;border-top:1px solid var(--line)}
.hd+.sec{border-top:0}
.sec h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 8px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h3 .n{font-family:var(--f-mono);font-size:12px;color:var(--red)}
.sec h3 .cnt{font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:-2px 0 10px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px}
.fields .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span,.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--input);border:1px solid var(--line);border-radius:5px;padding:8px 9px;width:100%;min-width:0;min-height:40px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
input[readonly]{background:var(--tint)}
.err{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:5px}
table{border-collapse:collapse;width:100%}
th{background:var(--navy);color:#fff;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:7px 8px;white-space:nowrap}
td{border-top:1px solid var(--line);padding:3px;vertical-align:top}
td input,td select{background:var(--input)}
td input:hover,td select:hover{border-color:var(--muted)}
td.x{width:34px;text-align:center;vertical-align:middle}
.formtbl{min-width:640px}
.rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:6px 8px;border-radius:4px}
.rm:hover{color:var(--bad);background:var(--badbg)}
.addrow{margin-top:8px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 14px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer;padding:6px 4px;border-radius:4px}
.checks label:hover{background:var(--tint)}
.checks input{width:20px;height:20px;min-height:0;margin:1px 0 0;accent-color:var(--red);flex:none}
.btn{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;border-radius:5px;padding:9px 18px;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;min-height:42px}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:var(--card);color:var(--fg);border-color:var(--line)}
.btn.sm{font-size:14px;padding:6px 12px;min-height:36px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{font-family:var(--f-display);font-weight:600;font-size:15px;padding:9px 16px;border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:42px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--tint);border-radius:0 0 6px 6px}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--navy);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.actionbar .wrap{padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hrs{font-family:var(--f-mono);font-size:22px;font-weight:500}
.saved{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:20px;padding:2px 8px;white-space:nowrap;font-family:var(--f-body)}
.pill.bim{background:#dfe8f5;color:#173d6b}
.pill.lay{background:#f6e1e2;color:#8e1b20}
.pill.rev{background:var(--okbg);color:var(--ok)}
.pill.new{background:var(--warnbg);color:var(--warn)}
.pill.k{background:var(--tint);color:var(--fg)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.list td,.list th{padding:9px 10px}
.list tbody tr{cursor:pointer}
.list tbody tr:hover td{background:var(--tint)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--tint);border-radius:5px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500}
.tile span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ro dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 14px;margin:0}
.ro dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ro dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ro .tbl table{min-width:520px}
.ro td{padding:6px 8px}
.chk{font-size:14px}
.chk .y{color:var(--ok);font-weight:700}.chk .n{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:5px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);z-index:30;max-width:calc(100% - 32px)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.split>*{min-width:0}
.muted{color:var(--muted)}
.back{background:none;border:0;color:var(--fg);cursor:pointer;font:inherit;font-weight:600;padding:6px 0}
.snip{font-size:12.5px;color:var(--muted);min-width:200px;max-width:340px}
mark{background:var(--warnbg);color:var(--fg);padding:0 1px;border-radius:2px}
.overlay{position:fixed;inset:0;background:var(--shade);z-index:20;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.panel.narrow{max-width:520px;margin-top:8vh}
.success{text-align:center;padding:36px 20px}
.success .tick{width:56px;height:56px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:0 auto 12px}
.success h2{font-size:28px}
.issues li{margin:3px 0}
.people td{padding:10px}
.daydots{display:flex;gap:4px}
.daydots span{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;font-size:10.5px;font-weight:600;background:var(--tint);color:var(--muted)}
.daydots span.y{background:var(--okbg);color:var(--ok)}
.daydots span.m{background:var(--badbg);color:var(--bad)}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
@media (max-width:720px){
  .logo img{height:40px}
  .who{width:100%;margin-left:0;text-align:left}
  .ftbl{border:0;overflow:visible}
  .formtbl,.formtbl tbody{display:block;min-width:0}
  .formtbl thead{display:none}
  .formtbl tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:6px;padding:30px 10px 10px;margin-bottom:8px;position:relative;background:var(--card)}
  .formtbl td{display:block;border:0;padding:0}
  .formtbl td::before{content:attr(data-l);display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .formtbl td.w{grid-column:1/-1}
  .formtbl td.x{position:absolute;top:2px;right:2px;width:auto}
  .formtbl td.x::before{display:none}
  .formtbl td input,.formtbl td select{border-color:var(--line);background:var(--input)}
  .actionbar .saved{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.whomenu{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:4px}
.linkbtn:hover{color:var(--fg)}
.login{max-width:420px;margin:6vh auto 0}
.cred{font-family:var(--f-mono);background:var(--tint);border-radius:5px;padding:12px;white-space:pre-wrap;font-size:14px}
</style>

/* review & send */
function checkDraft(d){const c=sch();const errs=[],warns=[];
  if(!d.date)errs.push({m:'Add the date.',el:'#h-date'});
  if(!d.name)errs.push({m:'Add your name.',el:'#h-name'});
  const hs=hoursSec(c);const rows=d.secs[hs.k].rows.filter(r=>Object.keys(r).length);
  if(!rows.length)errs.push({m:`Add at least one job with hours in “${hs.title}”.`,sec:hs.k});
  rows.forEach((r,i)=>{if(!r.job)errs.push({m:`A row in “${hs.title}” is missing the job #.`,sec:hs.k});if(!n(r.hours))errs.push({m:`${r.job||'A job'} in “${hs.title}” has no hours.`,sec:hs.k})});
  c.secs.filter(s=>s.type==='grid'&&!s.hours&&s.cols.some(x=>x.k==='job')).forEach(s=>d.secs[s.k].rows.forEach(r=>{if(Object.keys(r).length&&!r.job)warns.push(`A row in “${s.title}” has no job # picked.`)}));
  (d.secs.rfis?.rows||[]).forEach(r=>{if(Object.keys(r).length&&r.cc!=='Yes')warns.push(`RFI ${r.rfi||''} isn’t marked as CC’d to the VDC Manager.`)});
  (d.secs.asbuilts?.rows||[]).forEach(r=>{if(Object.keys(r).length&&!r.notified)warns.push('An as-built doesn’t say who was notified.')});
  if(st.kind==='daily'&&d.date>today())warns.push('The date is in the future.');
  return{errs:[...new Map(errs.map(e=>[e.m,e])).values()],warns:[...new Set(warns)]}}

    const first=document.querySelector('.err');first?.scrollIntoView({block:'center',behavior:'smooth'});first?.focus({preventScroll:true});
    toast(errs[0].m+(errs.length>1?` (+${errs.length-1} more)`:''));return}
  const preview=buildDoc(d);
  overlay(`<div class="panel"><div class="sheet"><div class="hd"><h2>Check it over</h2><span class="sub">Once you send it, it goes to Josh and you won’t be able to change it.</span></div>
   ${warns.length?`<div class="sec"><div class="banner warn"><b>Double-check:</b><ul class="issues" style="margin:6px 0 0;padding-left:18px">${warns.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div></div>`:''}
   <div class="foot"><button class="btn ghost" id="keepEdit">Keep editing</button><span class="grow"></span><span class="hrs">${preview.hours} hrs</span><button class="btn red" id="sendBtn">Send to Josh</button></div></div>
   ${reportHtml({...preview,submittedAt:null})}
   <div class="bar"><button class="btn ghost" id="keepEdit2">Keep editing</button><span class="grow"></span><button class="btn red" id="sendBtn2">Send to Josh</button></div></div>`);
  overlay.onclose=()=>overlay('');
  ['keepEdit','keepEdit2'].forEach(id=>$('#'+id).onclick=()=>overlay(''));
  ['sendBtn','sendBtn2'].forEach(id=>$('#'+id).onclick=()=>send(preview))}
function buildDoc(d){const c=sch();Object.values(d.secs).forEach(s=>{if(s.rows)s.rows=s.rows.filter(r=>Object.keys(r).length)});
  const jobs=new Set(),pos=new Set();let hours=0;
  c.secs.forEach(s=>{(d.secs[s.k].rows||[]).forEach(r=>{if(r.job)jobs.add(r.job);if(r.po)pos.add(r.po);if(s.hours)hours+=n(r.hours)});(s.fields||[]).forEach(f=>{const v=d.secs[s.k].fields?.[f.k];if(f.t==='job'&&v)jobs.add(v)})});
  return{team:st.team,kind:st.kind,date:d.date,name:d.name,head:d.head,secs:d.secs,jobs:[...jobs],pos:[...pos],hours:r1(hours),author:st.uid,reviewed:false}}
async function send(doc){if(!st.uid){toast('Your sign-in expired. Sign in again.');return}
  document.querySelectorAll('#sendBtn,#sendBtn2').forEach(b=>{b.disabled=true;b.textContent='Sending…'});
  const now=new Date();doc={...doc,submittedAt:now.toISOString(),updatedAt:now.toISOString()};
  try{const {error}=await sb.from('vdc_reports').insert({team:doc.team,kind:doc.kind,date:doc.date,name:doc.name,head:doc.head,secs:doc.secs,jobs:doc.jobs,pos:doc.pos,hours:doc.hours});if(error)throw error;
    if(st.owner)loadReports().then(rer);
    LS.set('vdc-name',doc.name);LS.set('vdc-head-'+doc.team,doc.head);
    if(doc.kind==='daily'){const hs=hoursSec(S[doc.team].daily);LS.set('vdc-last-'+doc.team,(doc.secs[hs.k].rows||[]).map(r=>{const o={job:r.job};if(r.po)o.po=r.po;if(r.foreman)o.foreman=r.foreman;return o}))}
    LS.del(draftKey());overlay('');st.submitted=`Your ${S[doc.team].daily.title.toLowerCase().includes('bim')&&doc.kind==='daily'?'daily BIM report':(doc.kind+' '+S[doc.team].short+' report')} for ${fmtD(doc.date)}`;render();window.scrollTo(0,0)}
  catch(err){document.querySelectorAll('#sendBtn,#sendBtn2').forEach(b=>{b.disabled=false;b.textContent='Send to Josh'});
    toast(err?.code==='42501'?'Your login isn’t allowed to send reports. Ask Josh to check your account.':/JWT|session/i.test(err?.message||'')?'Your sign-in expired. Sign in again; your draft is saved.':'Couldn’t send. Check your connection and try again. Your draft is saved.')}}

/* weekly autofill from own dailies */
async function fillWeek(){const we=$('#h-date').value;if(!we){toast('Set the week ending date first');return}
  const start=addDays(we,-6);const W=S[st.team].weekly;const fill=W.fill;
  let own=[];{const {data,error}=await sb.rpc('vdc_my_dailies',{p_team:st.team,p_from:start,p_to:we});if(error){toast('Couldn’t load your dailies. Try again.');return}own=(data||[]).map(normRep)}
  const dailies=own.filter(r=>r.date>=start&&r.date<=we).sort((a,b)=>a.date.localeCompare(b.date));
  if(!dailies.length){toast('No dailies found for the week ending '+fmtShort(we));return}
  const cur=readForm();const hs=W.secs.find(s=>s.k==='hours');const map={};const dk=['sun','mon','tue','wed','thu','fri','sat'];
  dailies.forEach(r=>(r.secs[fill.hours]?.rows||[]).forEach(row=>{const key=(row.job||'')+'|'+(row.po||'');map[key]=map[key]||{job:row.job,po:row.po};const day=dk[parseD(r.date).getDay()];if(hs.days.includes(day))map[key][day]=r1(n(map[key][day])+n(row.hours))}));
  cur.secs.hours.rows=Object.values(map).map(r=>{let t=0;hs.days.forEach(d=>t+=n(r[d]));return{...r,hours:r1(t)}});
  fill.copy.forEach(cp=>{let rows=[];
    if(cp.latest)rows=(dailies[dailies.length-1].secs[cp.from]?.rows||[]).map(r=>({...r}));
    else dailies.forEach(r=>(r.secs[cp.from]?.rows||[]).forEach(row=>{if(cp.when&&!cp.when(row))return;rows.push(cp.map?cp.map(row):{...row})}));
    if(cp.group){const g={};rows.forEach(r=>{const k=r.job||'';g[k]=g[k]||{job:r.job,done:[],points:0};g[k].done.push([r.area,r.systems].filter(Boolean).join(' '));g[k].points+=n(r.points)});
      const fm={};dailies.forEach(r=>(r.secs.jobs?.rows||[]).forEach(x=>{if(x.job&&x.foreman)fm[x.job]=x.foreman}));
      rows=Object.values(g).map(x=>({job:x.job,foreman:fm[x.job]||'',done:[...new Set(x.done.filter(Boolean))].join('; '),points:x.points||''}))}
    if(cp.sum){const g={};rows.forEach(r=>{const k=(r.item||'')+'|'+(r.job||'');g[k]=g[k]||{item:r.item,job:r.job,qty:0};g[k].qty+=n(r.qty)});rows=Object.values(g)}
    const ex=(cur.secs[cp.to].rows||[]).filter(r=>Object.keys(r).length);cur.secs[cp.to].rows=[...ex,...rows]});
  const rs=dailies[dailies.length-1].secs.gangbox?.fields?.restock;if(rs&&cur.secs.gangbox){cur.secs.gangbox.fields=cur.secs.gangbox.fields||{};cur.secs.gangbox.fields.restock=rs}
  LS.set(draftKey(),cur);render();toast(`Filled in from ${dailies.length} daily report${dailies.length>1?'s':''}. Check it over.`)}

/* ---------- read-only report ---------- */
function jobLabel(no){const j=st.jobs[jobKey(no)];return j?`${no} · ${j.name||''}`:String(no||'')}
function cell(c,v){if(v==null||v==='')return'';if(c.t==='job')return esc(jobLabel(v));if(c.t==='date')return esc(fmtShort(v));return esc(v)}
function reportHtml(r,onlyJob){const c=S[r.team]?.[r.kind];if(!c)return'<div class="sheet"><div class="empty">Unknown report type</div></div>';
  const head=[{l:r.kind==='weekly'?'Week ending':'Date',v:fmtD(r.date)},{l:r.team==='bim'?'Modeler':'Crew member(s)',v:r.name},...c.header.map(h=>({l:h.l,v:r.head?.[h.k]})),{l:'Total hours',v:r.hours}];
  let h=`<div class="sheet ro"><div class="hd"><h2>${c.title}</h2><span class="pill ${r.team==='bim'?'bim':'lay'}">${S[r.team].label}</span>${r.submittedAt?(r.reviewed?'<span class="pill rev">Reviewed</span>':'<span class="pill new">Not reviewed</span>'):''}${r.submittedAt?`<span class="sub">Sent ${esc(new Date(r.submittedAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</span>`:''}</div>
  <div class="sec"><dl>${head.map(x=>`<div><dt>${esc(x.l)}</dt><dd>${esc(x.v??'')||'—'}</dd></div>`).join('')}</dl></div>`;
  c.secs.forEach((s,si)=>{const v0=r.secs?.[s.k]||{};const v=onlyJob&&s.cols?.some(x=>x.k==='job')?{...v0,rows:(v0.rows||[]).filter(x=>x.job===onlyJob)}:v0;let body='';
    if(s.type==='grid'&&v.rows?.length)body+=`<div class="tbl"><table><thead><tr>${s.cols.map(x=>`<th>${esc(x.l)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(row=>`<tr>${s.cols.map(x=>`<td class="${x.t==='num'?'num':''}">${cell(x,row[x.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(s.type==='checks')body+=`<div class="checks chk">${s.items.map((it,i)=>`<div>${v.checks?.[i]?'<span class="y">✓</span>':'<span class="n">○</span>'} ${esc(it)}</div>`).join('')}</div>`;
    if(s.fields){const fv=s.fields.filter(f=>v.fields?.[f.k]!=null&&v.fields[f.k]!=='');if(fv.length)body+=`<dl style="margin-top:8px">${fv.map(f=>`<div${f.full?' style="grid-column:1/-1"':''}><dt>${esc(f.l)}</dt><dd>${cell(f,v.fields[f.k])}</dd></div>`).join('')}</dl>`}
    h+=`<div class="sec"><h3><span class="n">${si+1}</span>${esc(s.title)}</h3>${body||'<span class="muted">Nothing entered</span>'}</div>`});
  return h+`</div>`}

/* ---------- data helpers ---------- */
function allReports(){return st.reports}
const textCache=new Map();
function repPOs(r){if(r.pos)return r.pos;const p=new Set();Object.values(r.secs||{}).forEach(v=>(v.rows||[]).forEach(x=>{if(x.po)p.add(x.po)}));return[...p]}
function repText(r){const key=r._uid+'|'+r._id+'|'+(r.updatedAt||'');if(textCache.has(key))return textCache.get(key);
  const parts=[r.name,S[r.team]?.label,r.kind,r.date,...(r.jobs||[]).map(j=>jobLabel(j)),...repPOs(r),...Object.values(r.head||{})];
  const walk=o=>{if(o==null)return;if(typeof o==='object')Object.values(o).forEach(walk);else if(o!==true)parts.push(String(o))};walk(r.secs);
  S[r.team]?.[r.kind]?.secs.forEach(s=>{if(s.type==='checks')s.items.forEach((it,i)=>{if(r.secs?.[s.k]?.checks?.[i])parts.push(it)})});
  const t=parts.filter(Boolean).join(' · ');textCache.set(key,t);return t}
const terms=q=>String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
function matchQ(r,q){const ts=terms(q);if(!ts.length)return true;const t=repText(r).toLowerCase();return ts.every(x=>t.includes(x))}
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function snippet(r,q){const ts=terms(q);if(!ts.length)return'';const t=repText(r);const i=t.toLowerCase().indexOf(ts[0]);if(i<0)return'';const a=Math.max(0,i-40),b=Math.min(t.length,i+ts[0].length+60);
  let out=esc((a?'…':'')+t.slice(a,b)+(b<t.length?'…':''));ts.forEach(x=>{out=out.replace(new RegExp('('+reEsc(esc(x))+')','ig'),'<mark>$1</mark>')});return out}
function allPOs(job){const m=new Map();Object.values(st.jobs).forEach(j=>{if(job&&j.jobNo!==job)return;(j.pos||[]).forEach(p=>m.set(p.po,{po:p.po,desc:p.desc,job:j.jobNo}))});
  allReports().forEach(r=>Object.values(r.secs||{}).forEach(v=>(v.rows||[]).forEach(x=>{if(x.po&&!m.has(x.po)&&(!job||x.job===job))m.set(x.po,{po:x.po,job:x.job})})));
  return[...m.values()].sort((a,b)=>String(a.po).localeCompare(String(b.po),undefined,{numeric:true}))}
function people(){const p={};allReports().forEach(r=>{const x=p[r._uid]=p[r._uid]||{uid:r._uid,name:'',teams:new Set(),last:'',lastAt:'',reps:[]};x.reps.push(r);x.teams.add(r.team);
  if((r.submittedAt||'')>x.lastAt){x.lastAt=r.submittedAt||'';x.name=r.name||x.name}if(r.kind==='daily'&&r.date>x.last)x.last=r.date});
  return Object.values(p).sort((a,b)=>String(a.name).localeCompare(String(b.name)))}
const personName=uid=>people().find(p=>p.uid===uid)?.name||'Team member';
function workdays(from,to){const out=[];let d=from;while(d<=to){const w=parseD(d).getDay();if(w>0&&w<6)out.push(d);d=addDays(d,1)}return out}

/* ---------- JOB FILES ---------- */
function jobFileReps(){const J=st.jr;if(!J.job&&!J.po)return[];
  return allReports().filter(r=>(!J.job||(r.jobs||[]).includes(J.job))&&(!J.po||repPOs(r).includes(J.po))&&(!J.from||r.date>=J.from)&&(!J.to||r.date<=J.to)&&matchQ(r,J.q))
   .sort((a,b)=>a.date.localeCompare(b.date)||(a.kind===b.kind?0:a.kind==='daily'?-1:1)||String(a.name).localeCompare(String(b.name)))}
function rollup(reps,{job,po,weeklies}){const out={secs:[],hrsPO:{},hrsPerson:{},hrsJob:{},hrsTeam:{bim:0,layout:0},points:0,openRfi:0,daily:0,weekly:0};
  reps.forEach(r=>out[r.kind]++);
  ['bim','layout'].forEach(team=>['daily','weekly'].forEach(kind=>{if(kind==='weekly'&&!weeklies)return;
    S[team][kind].secs.forEach(s=>{if(s.type!=='grid'||!s.cols.some(c=>c.k==='job'))return;const rows=[];
      reps.filter(r=>r.team===team&&r.kind===kind).forEach(r=>(r.secs?.[s.k]?.rows||[]).forEach(row=>{if(job&&row.job!==job)return;if(po&&s.hours&&row.po!==po)return;rows.push({_date:r.date,_name:r.name,...row})}));
      if(s.hours&&kind==='daily')rows.forEach(row=>{const h=n(row.hours);out.hrsTeam[team]+=h;const p=row.po||'(no PO)';out.hrsPO[p]=r1((out.hrsPO[p]||0)+h);out.hrsPerson[row._name]=r1((out.hrsPerson[row._name]||0)+h);const jl=jobLabel(row.job)||'(no job)';out.hrsJob[jl]=r1((out.hrsJob[jl]||0)+h)});
      if(kind==='daily'&&s.k==='layout')rows.forEach(x=>out.points+=n(x.points));
      if(kind==='daily'&&s.k==='rfis')rows.forEach(x=>{if(x.status!=='Answered')out.openRfi++});
      if(rows.length)out.secs.push({team,kind,s,rows})})}));
  return out}
function rollupTables(d,showJob){return d.secs.map(x=>{const cols=x.s.cols.filter(c=>showJob||c.k!=='job');return `<div class="sheet ro"><div class="sec"><h3>${esc(x.s.title)} <span class="pill ${x.team==='bim'?'bim':'lay'}">${S[x.team].short} ${x.kind}</span></h3><div class="tbl"><table><thead><tr><th>Date</th><th>Name</th>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${x.rows.map(r=>`<tr><td class="mono" style="white-space:nowrap">${esc(fmtShort(r._date))}</td><td>${esc(r._name)}</td>${cols.map(c=>`<td class="${c.t==='num'?'num':''}">${cell(c,r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></div>`}).join('')}
function miniTable(t,o){const e=Object.entries(o).sort((a,b)=>b[1]-a[1]);return `<div class="sheet ro"><div class="sec"><h3>${t}</h3>${e.length?`<div class="tbl"><table style="min-width:0"><tbody>${e.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('')}</tbody></table></div>`:'<span class="muted">No hours logged</span>'}</div></div>`}
function viewSeg(cur,extra){return `<div class="seg" role="group" aria-label="View"><button data-view="all" aria-pressed="${cur==='all'}">Full reports</button><button data-view="sum" aria-pressed="${cur==='sum'}">Summary tables</button></div>${extra||''}`}

    <label class="f full"><span>Keywords</span><input type="search" id="pf-q" value="${esc(P.q)}" placeholder="Search this person’s reports"></label>
   </div></div>
   <div class="sec"><div class="tiles">${[[r1(d.hrsTeam.bim+d.hrsTeam.layout),'Daily hours'],[d.daily,'Dailies'],[d.weekly,'Weeklies'],[missing.length,'Missing dailies'],[reps.filter(r=>!r.reviewed).length,'To review']].map(([b,s])=>`<div class="tile"><b>${b}</b><span>${s}</span></div>`).join('')}</div>
   ${missing.length?`<p class="note" style="margin:10px 0 0">No daily for: ${missing.slice(-12).map(x=>esc(fmtShort(x))).join(', ')}${missing.length>12?' …':''}</p>`:''}</div>

  $('#pBack').onclick=()=>{P.uid='';render()};

  $('#pf-range').onchange=e=>{const v=e.target.value,t=today();if(v==='wk'){P.from=weekStart();P.to=t}else if(v==='lw'){P.from=addDays(weekStart(),-7);P.to=addDays(weekStart(),-1)}else if(v==='30'){P.from=addDays(t,-30);P.to=t}else{P.from='';P.to=''}render()};
  let qt;$('#pf-q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{P.q=e.target.value;render();const el=$('#pf-q');el.focus();el.setSelectionRange(el.value.length,el.value.length)},250)};
  v.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{P.view=b.dataset.view;render()});
  bindOpen(v);
  $('#csvP')&&($('#csvP').onclick=()=>saveCsv(rollupCsv(d,[['Team member',me.name],['Dates',(P.from||'start')+' to '+(P.to||'today')],['Missing dailies',missing.join(' ')]])+'\r\n\r\n'+csv([H,...reps.flatMap(flatRows)]),`${(me.name||'team-member').replace(/\W+/g,'-')}-reports.csv`))}

/* ---------- CSV ---------- */
const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csv=rows=>rows.map(r=>r.map(q).join(',')).join('\r\n');
const H=['Date','Name','Team','Type','Section','Job #','PO / Task #','Details','Hours'];
function flatRows(r){const out=[];const c=S[r.team]?.[r.kind];if(!c)return out;c.secs.forEach(s=>{const v=r.secs?.[s.k]||{};
  (v.rows||[]).forEach(row=>out.push([r.date,r.name,S[r.team].label,r.kind,s.title,row.job||'',row.po||'',s.cols.filter(x=>!['job','po'].includes(x.k)).map(x=>row[x.k]!=null&&row[x.k]!==''?`${x.l}: ${row[x.k]}`:'').filter(Boolean).join(' | '),s.hours?row.hours??'':'']));
  if(s.type==='checks')out.push([r.date,r.name,S[r.team].label,r.kind,s.title,'','',s.items.map((it,i)=>(v.checks?.[i]?'[x] ':'[ ] ')+it).join(' | '),'']);
  (s.fields||[]).forEach(f=>{if(v.fields?.[f.k]!=null&&v.fields[f.k]!=='')out.push([r.date,r.name,S[r.team].label,r.kind,s.title,f.t==='job'?v.fields[f.k]:'','',`${f.l}: ${v.fields[f.k]}`,''])})});return out}
function rollupCsv(d,head){const rows=[...head,[],['Hours by PO','Hours'],...Object.entries(d.hrsPO),[],['Hours by person','Hours'],...Object.entries(d.hrsPerson),[],['Hours by job','Hours'],...Object.entries(d.hrsJob),[]];
  d.secs.forEach(x=>{const cols=x.s.cols;rows.push([`${x.s.title} (${S[x.team].short} ${x.kind})`]);rows.push(['Date','Name',...cols.map(c=>c.l)]);x.rows.forEach(r=>rows.push([r._date,r._name,...cols.map(c=>r[c.k]??'')]));rows.push([])});return csv(rows)}
function saveCsv(data,filename){const b=new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Downloaded '+filename)}

function confirmBox(msg,yes,fn){overlay(`<div class="panel narrow"><div class="sheet"><div class="sec"><p style="margin:0;font-size:16px">${esc(msg)}</p></div><div class="foot"><button class="btn ghost" id="cNo">Cancel</button><span class="grow"></span><button class="btn red" id="cYes">${esc(yes)}</button></div></div></div>`);
  overlay.onclose=()=>overlay('');$('#cNo').onclick=()=>overlay('');$('#cYes').onclick=()=>{overlay('');fn()}}

/* ---------- data loading ---------- */
let rt;const rer=()=>{clearTimeout(rt);rt=setTimeout(()=>{if(st.ready&&!$('#rform')&&!$('#ovbg'))render()},150)};
async function loadJobs(){const {data,error}=await sb.from('vdc_jobs').select('*');if(error)return;const m={};(data||[]).forEach(j=>m[jobKey(j.job_no)]=normJob(j));st.jobs=m}
/* full load once, then only reports newer than the newest one already on screen (keeps data use small) */
async function loadReports(full){if(!st.owner)return;
  const newest=!full&&st.reports.length?st.reports.reduce((m,r)=>r.submittedAt>m?r.submittedAt:m,''):'';
  const out=[];for(let from=0;;from+=1000){let q=sb.from('vdc_reports').select('*').order('submitted_at',{ascending:false}).range(from,from+999);if(newest)q=q.gt('submitted_at',newest);
    const {data,error}=await q;if(error)return;out.push(...data);if(data.length<1000)break}
  if(newest){if(!out.length)return;const seen=new Set(st.reports.map(r=>r._id));st.reports=[...out.map(normRep).filter(r=>!seen.has(r._id)),...st.reports]}
  else st.reports=out.map(normRep);
  textCache.clear()}
async function loadMembers(){if(!st.owner)return;const {data}=await sb.from('vdc_members').select('*').order('name');st.members=data||[]}
let lastRefresh=0;
async function refresh(force){if(!st.me)return;if(!force&&Date.now()-lastRefresh<15000)return;lastRefresh=Date.now();
  await Promise.all([loadJobs(),loadReports(),st.tab==='accounts'?loadMembers():null]);rer()}
setInterval(()=>{if(document.visibilityState==='visible')refresh()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});

    try{await fnCall({action:'bootstrap',name:$('#suN').value,login:$('#suU').value,password:$('#suP').value});
      const {error}=await sb.auth.signInWithPassword({email:loginEmail($('#suU').value),password:$('#suP').value});if(error)throw error;await start()}
    catch(err){b.disabled=false;toast(err.message)}}}
function viewNoMember(v){$('#abar').innerHTML='';v.innerHTML=`<div class="sheet login"><div class="hd"><h2>No access yet</h2></div><div class="sec"><p style="margin:0">This login isn’t set up for the Daily Log, or it has been turned off. Ask Josh to add you on the Logins tab.</p></div><div class="foot"><span class="grow"></span><button class="btn ghost" id="nmOut">Sign out</button></div></div>`;
  $('#nmOut').onclick=async()=>{await sb.auth.signOut();location.reload()}}

/* ---------- LOGINS (admin) ---------- */
const TEAMN={bim:'BIM Modeling',layout:'Trimble Layout',both:'Both teams'};
function tempPw(){const w=['Conduit','Strut','Panel','Feeder','Breaker','Level','Survey','Station','Prism','Spool'];const a=new Uint32Array(2);crypto.getRandomValues(a);return `${w[a[0]%w.length]}-${1000+a[1]%9000}`}
function viewAccounts(v){const ms=st.members;
  v.innerHTML=`<div class="sheet"><div class="hd"><h2>Logins</h2><span class="sub">Who can use the Daily Log. Team members only ever see the report form.</span><span class="grow"></span><button class="btn sm" id="addPerson">+ Add person</button></div>
  ${ms.length?`<div class="tbl" style="border:0;border-radius:0"><table class="list"><thead><tr><th>Name</th><th>Username</th><th>Team</th><th>Access</th><th>Status</th><th></th></tr></thead><tbody>${ms.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td class="mono">${esc(m.login)}</td><td>${esc(TEAMN[m.team]||m.team)}</td><td>${m.role==='admin'?'<span class="pill bim">Manager</span>':'<span class="pill k">Team member</span>'}</td><td>${m.active?'<span class="pill rev">Active</span>':'<span class="pill bad">Turned off</span>'}</td>
   <td style="white-space:nowrap;text-align:right"><button class="btn ghost sm" data-edit="${esc(m.user_id)}">Edit</button> <button class="btn ghost sm" data-reset="${esc(m.user_id)}">Reset password</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Loading…</div>`}</div>
  <div class="sheet"><div class="sec"><h3>How your team gets in</h3><p class="note" style="margin:0">Add each person here, then send them the link, their username, and the temporary password. They can change it from the top of the page after signing in. They stay signed in on their device.</p></div></div>`;
  if(!ms.length)loadMembers().then(()=>st.members.length&&render());
  $('#addPerson').onclick=()=>personForm();
  v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>personForm(st.members.find(m=>m.user_id===b.dataset.edit)));
  v.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetForm(st.members.find(m=>m.user_id===b.dataset.reset)))}
function credCard(name,login,pw){const link=location.origin+location.pathname;const txt=`Adman VDC Daily Log\n${link}\nUsername: ${login}\nPassword: ${pw}`;
  overlay(`<div class="panel narrow"><div class="sheet"><div class="hd"><h2>Send this to ${esc(name)}</h2><span class="sub">This is the only time the password is shown.</span></div><div class="sec"><div class="cred" id="credTxt">${esc(txt)}</div></div>
  <div class="foot"><button class="btn ghost" id="crDone">Done</button><span class="grow"></span><button class="btn red" id="crCopy">Copy</button></div></div></div>`);
  overlay.onclose=()=>overlay('');$('#crDone').onclick=()=>overlay('');
  $('#crCopy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('Copied')}catch(e){const r=document.createRange();r.selectNodeContents($('#credTxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selected. Press Ctrl+C or Copy.')}}}
function personForm(m){const isNew=!m;m=m||{team:'bim',role:'member',active:true};const pw=tempPw();
  overlay(`<div class="panel narrow"><div class="sheet"><div class="hd"><h2>${isNew?'Add a person':'Edit '+esc(m.name)}</h2></div><div class="sec"><div class="fields">
   <label class="f full"><span>Name</span><input id="pfN" value="${esc(m.name||'')}"></label>
   ${isNew?`<label class="f"><span>Username</span><input id="pfU" autocapitalize="none" spellcheck="false" placeholder="first initial + last name"></label>
   <label class="f"><span>Temporary password</span><input id="pfP" value="${esc(pw)}"></label>`:''}
   <label class="f"><span>Team</span><select id="pfT">${Object.entries(TEAMN).map(([k,l])=>`<option value="${k}"${m.team===k?' selected':''}>${l}</option>`).join('')}</select></label>
   <label class="f"><span>Access</span><select id="pfR"><option value="member">Team member (form only)</option><option value="admin"${m.role==='admin'?' selected':''}>Manager (sees all reports)</option></select></label>
   ${isNew?'':`<label class="f"><span>Status</span><select id="pfA"><option value="1">Active</option><option value="0"${m.active?'':' selected'}>Turned off</option></select></label>`}
  </div></div><div class="foot"><button class="btn ghost" id="pfNo">Cancel</button><span class="grow"></span><button class="btn red" id="pfYes">${isNew?'Create login':'Save'}</button></div></div></div>`);
  overlay.onclose=()=>overlay('');$('#pfNo').onclick=()=>overlay('');setTimeout(()=>$('#pfN').focus(),30);
  if(isNew)$('#pfN').oninput=e=>{const p=e.target.value.trim().toLowerCase().split(/\s+/);if(p.length>1&&!$('#pfU').dataset.touched)$('#pfU').value=(p[0][0]+p[p.length-1]).replace(/[^a-z0-9]/g,'')};
  if(isNew)$('#pfU').oninput=e=>e.target.dataset.touched=1;
  $('#pfYes').onclick=async()=>{const b=$('#pfYes');b.disabled=true;
    try{if(isNew){const login=$('#pfU').value.trim().toLowerCase(),pass=$('#pfP').value;await fnCall({action:'create',name:$('#pfN').value,login,password:pass,team:$('#pfT').value,role:$('#pfR').value});await loadMembers();render();credCard($('#pfN')?.value||'them',login,pass)}
      else{await fnCall({action:'update',user_id:m.user_id,name:$('#pfN').value,team:$('#pfT').value,role:$('#pfR').value,active:$('#pfA').value==='1'});overlay('');await loadMembers();render();toast('Saved')}}
    catch(err){b.disabled=false;toast(err.message)}}}
function resetForm(m){const pw=tempPw();
  overlay(`<div class="panel narrow"><div class="sheet"><div class="hd"><h2>Reset ${esc(m.name)}’s password</h2></div><div class="sec"><div class="fields"><label class="f full"><span>New temporary password</span><input id="rpP" value="${esc(pw)}"></label></div></div>
  <div class="foot"><button class="btn ghost" id="rpNo">Cancel</button><span class="grow"></span><button class="btn red" id="rpYes">Reset password</button></div></div></div>`);
  overlay.onclose=()=>overlay('');$('#rpNo').onclick=()=>overlay('');
  $('#rpYes').onclick=async()=>{const p=$('#rpP').value;try{await fnCall({action:'reset',user_id:m.user_id,password:p});credCard(m.name,m.login,p)}catch(err){toast(err.message)}}}

/* ---------- boot ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){const {data:needs}=await sb.rpc('vdc_needs_setup');st.auth=needs?'setup':'login';st.me=null;tabs();whoBar();render();return}
  st.uid=session.user.id;
  const {data:me,error}=await sb.from('vdc_members').select('*').eq('user_id',st.uid).maybeSingle();
  if(error&&!me){st.auth='login';toast('Couldn’t reach the server. Check your connection.');render();return}
  if(!me||!me.active){st.auth='nomember';st.me=null;whoBar();render();return}
  st.me=me;st.owner=me.role==='admin';st.auth='in';
  if(!LS.get('vdc-name',''))LS.set('vdc-name',me.name);
  if(LS.get('vdc-team',null)==null&&me.team!=='both'){st.team=me.team}
  st.tab=st.owner?'log':'new';whoBar();
  await Promise.all([loadJobs(),loadReports(true),loadMembers()]);lastRefresh=Date.now();
  st.ready=true;render()}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'){st.me=null;st.auth='login';render()}});
render();start();

</script>
</body>
</html>
